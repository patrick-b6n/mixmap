[package]
name = "mixmap-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mixmap_core"
path = "src/lib.rs"

[dependencies]
aes = "0.8"
axum = "0.8"
cbc = "0.1"
getrandom = "0.4"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lofty = "0.25.5"
mdns-sd = "0.21.7"
memchr = "2.8.3"
notify-debouncer-mini = "0.7.0"
pbkdf2 = "0.13"
percent-encoding = "2.3.2"
quick-xml = "0.42.0"
rusqlite = { version = "0.42.0", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["net", "rt-multi-thread", "sync", "macros"] }
ureq = { version = "3.5.2", default-features = false, features = ["json"] }
uuid = { version = "1.29.2", features = ["v4"] }
x25519-dalek = { version = "3.0.0", features = ["getrandom"] }

[dev-dependencies]
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "rt-multi-thread"] }

[target."cfg(windows)".dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_System_Memory", "Win32_System_Diagnostics_Debug", "Win32_System_Diagnostics_ToolHelp", "Win32_System_ProcessStatus", "Win32_Storage_FileSystem"] }
