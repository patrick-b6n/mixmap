[package]
name = "mixmap-core"
edition.workspace = true
license.workspace = true
version.workspace = true

[lib]
name = "mixmap_core"
path = "src/lib.rs"

[dependencies]
aes = "0.8"
cbc = "0.1"
hmac = "0.12"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
lofty = "0.25.5"
notify-debouncer-mini = "0.7.0"
pbkdf2 = "0.12"
rusqlite = { version = "0.42.0", features = ["bundled", "serialize"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10"
thiserror = "2.0.21"
