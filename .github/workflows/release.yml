name: Release

# Every push to main checks, builds the portable mixmap.exe and publishes it as a
# GitHub Release tagged `v<CalVer>`, with `mixmap.exe.sha256`. The app reads
# `releases/latest` and updates itself from it (docs/release.md).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One group per ref: only one release run per ref at a time; a new push cancels the
# running one. Its commits are part of the newer run's release, and a cancelled run
# never created a tag, so the versions stay consistent.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & Release (windows-latest)
    # workflow_dispatch works on any branch; releases only from main.
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      # gh release create
      contents: write
    steps:
      # Only the current head of main is published. A re-run of an old run would
      # otherwise publish older code as "Latest"; its commits are included in the
      # newer run's release. Checked again before `gh release create`.
      - name: Check head of main
        id: head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" = "$GITHUB_SHA" ]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No release: $GITHUB_SHA is no longer the head of main ($head); the newer run publishes these commits."
            echo "current=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.head.outputs.current == 'true'
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Version comes from "packageManager" in package.json.
      - name: Setup pnpm
        if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@v6
        with:
          cache: true

      - name: Setup Node.js
        if: steps.head.outputs.current == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 26

      - name: Setup Rust (stable)
        if: steps.head.outputs.current == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      # Saves main's cache (ci.yml doesn't run on main). Same key as ci.yml, so PR
      # runs restore it.
      - name: Cargo cache
        if: steps.head.outputs.current == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          shared-key: tauri-release

      - name: Install dependencies
        if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile

      # Format, lint, typecheck and tests of both TypeScript and Rust.
      - name: Verify
        if: steps.head.outputs.current == 'true'
        run: pnpm verify

      # Same check as ci.yml: schema and committed migrations must match.
      - name: Migrations up to date
        if: steps.head.outputs.current == 'true'
        timeout-minutes: 5
        shell: bash
        run: |
          pnpm db:generate
          git add -N src/persistence/migrations
          git diff --exit-code -- src/persistence/migrations

      # The version is the build time in UTC as YYYY.MM.DD.HHMM, strictly newer than
      # every existing tag (otherwise the latest tag + 1 minute;
      # scripts/release-version.ts). Its SemVer form (YYYY.MMDD.HHMM) is written into
      # package.json (not committed), which tauri.conf.json reads. The tags come from
      # the API; the checkout stays shallow.
      - name: Determine version
        if: steps.head.outputs.current == 'true'
        id: version
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/tags/v" \
            --jq '.[].ref | ltrimstr("refs/tags/")' \
            | node scripts/release-version.ts --set >> "$GITHUB_OUTPUT"

      - name: Build mixmap.exe
        if: steps.head.outputs.current == 'true'
        run: pnpm tauri build --no-bundle

      - name: Release assets
        if: steps.head.outputs.current == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist-release
          cp src-tauri/target/release/mixmap.exe dist-release/mixmap.exe
          (cd dist-release && sha256sum mixmap.exe > mixmap.exe.sha256)
          cat dist-release/mixmap.exe.sha256

      # Tags `v<version>` on the built commit. Not a pre-release, explicitly "Latest":
      # the app reads `releases/latest`. `gh` uploads the assets before it publishes.
      - name: Publish GitHub release
        if: steps.head.outputs.current == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          TITLE: ${{ steps.version.outputs.title }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          if [ "$head" != "$GITHUB_SHA" ]; then
            echo "::notice::No release: main moved on to $head during the build; the newer run publishes these commits."
            exit 0
          fi
          gh release create "v$VERSION" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "$TITLE" \
            --generate-notes \
            --latest \
            dist-release/mixmap.exe \
            dist-release/mixmap.exe.sha256
